name: Deploy Modal

on:
  push:
    branches: [main]
    paths:
      - "modal_app/**"
      - "requirements.txt"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-modal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # All optional — `app.config_secret` forwards whatever is set here
          # into the API container, and empty means "not configured".
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          # Empty means watermarking is on; set the variable to 0 to turn it off.
          WATERMARK: ${{ vars.WATERMARK }}
          # Empty means no per-IP cap; set the variable to a positive integer
          # (5 is what plan §9 asks for) to put one back.
          JOBS_PER_HOUR: ${{ vars.JOBS_PER_HOUR }}
          # Empty means the beat generator is not shipped, which is the default:
          # its image is heavy and, until somebody has watched it build, a
          # broken one fails the whole deploy rather than its own function. Set
          # the variable to 1 to include it — and set HF_TOKEN with it, because
          # Stable Audio Open's weights are gated.
          BEAT_GENERATOR: ${{ vars.BEAT_GENERATOR }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # modal_app.deploy, not modal_app.api: a function is published only if
        # the module defining it was imported, and the cron plus the GPU class
        # live in modules the API never touches.
        run: modal deploy -m modal_app.deploy
